<!doctype html><meta charset="utf-8"><title>dev shots</title>
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;width:375px;height:812px;background:#fff}</style>
<iframe id="f"></iframe>
<script>
// Dev-only harness: renders the site at iPhone 12 mini size and clicks through to a screen.
// Usage: /_shots.html?screen=intro|level1|quiz|memory|jigsaw|hearts|lock|letter|question
const screen = new URLSearchParams(location.search).get("screen") || "intro";
const f = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const click = async (sel, ms = 700) => { const el = f.contentDocument.querySelector(sel); if (el) el.click(); await wait(ms); };
const plans = {
  intro:    { url: "/?reset", steps: [] },
  level1:   { url: "/?reset&level=1", steps: [] },
  quiz:     { url: "/?reset&level=1", steps: ["#go", "#go"] },
  memory:   { url: "/?reset&level=2", steps: ["#go"] },
  jigsaw:   { url: "/?reset&level=3", steps: ["#go"] },
  hearts:   { url: "/?reset&level=4", steps: ["#go"] },
  lock:     { url: "/?reset&level=5", steps: ["#go"] },
  letter:   { url: "/?reset&level=6", steps: [] },
  question: { url: "/?reset&level=6", steps: ["#typed", "#next"] },
  clear:    { url: "/?reset&level=5", steps: ["#go", ".key[data-k='1']", ".key[data-k='4']", ".key[data-k='0']", ".key[data-k='9']"] },
};
const plan = plans[screen] || plans.intro;
f.src = plan.url;
f.addEventListener("load", async () => {
  await wait(900);
  for (const s of plan.steps) await click(s, s === "#typed" ? 400 : 900);
  await wait(1200);
  document.title = "ready:" + screen;
});
</script>
